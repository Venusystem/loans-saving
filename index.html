<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loan Manager</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#66707d;--bd:#e2e5ea;--pr:#0f766e;--pr2:#e6f4f2;--rd:#c0392b;--am:#b7791f;--gn:#2f855a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2129;--tx:#e8ecf1;--mu:#93a0af;--bd:#2c3540;--pr:#2dd4bf;--pr2:#16302d;--rd:#f28b82;--am:#f0b429;--gn:#68d391}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2129;--tx:#e8ecf1;--mu:#93a0af;--bd:#2c3540;--pr:#2dd4bf;--pr2:#16302d;--rd:#f28b82;--am:#f0b429;--gn:#68d391}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header img{height:32px;border-radius:6px}.brand{font-weight:700;font-size:17px}
.search{flex:1;min-width:180px;position:relative}
input,select,button,textarea{font:inherit;color:var(--tx)}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
#sr{position:absolute;left:0;right:0;top:40px;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:300px;overflow:auto;display:none;box-shadow:0 8px 24px #0003}
#sr div{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}#sr div:hover{background:var(--pr2)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--mu)}
nav button.on{background:var(--pr2);color:var(--pr);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.kpi small{color:var(--mu);display:block}.kpi b{font-size:19px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.btn{background:var(--pr);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
:root[data-theme="dark"] .btn{color:#062b27}
.btn.g{background:none;color:var(--pr);border:1px solid var(--bd)}.btn.s{padding:4px 9px;font-size:13px}.btn.d{background:var(--rd);color:#fff}
.tw{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;font-size:14px}
@media print{.tw{overflow:visible!important;max-height:none!important}}
.noprint{}
@media print{header,nav,.bar,.noprint,.btn{display:none!important}body{background:#fff}main{padding:0;max-width:100%}.card{border:none;box-shadow:none;padding:0;margin:0}}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr)}
.tag.Overdue{background:#c0392b22;color:var(--rd)}.tag.Paid{background:#2f855a22;color:var(--gn)}.tag.Written{background:#66707d33;color:var(--mu)}
.tag.Fix{background:#b7791f22;color:var(--am)}
.tag.Topped{background:#0f766e22;color:var(--pr)}
tr[data-ctx]{cursor:pointer}tr[data-ctx]:hover td{background:var(--pr2)}
.ctxm{position:fixed;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px #0004;z-index:50;min-width:170px;overflow:hidden;padding:4px}
.ctxm div{padding:9px 14px;cursor:pointer;font-size:14px;border-radius:6px}.ctxm div:hover{background:var(--pr2)}.ctxm div.d{color:var(--rd)}
.hint{font-size:12px;color:var(--mu)}
.gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.gate .card{max-width:340px;width:100%}
body.gated header,body.gated nav,body.gated main{display:none}
#rcpt{display:none}
@media print{
 body.printrec>*:not(#rcpt){display:none!important}
 body.printrec #rcpt{display:block!important;max-width:380px;margin:0 auto;font:13px/1.5 system-ui;color:#111}
}
.amt{display:inline-block}
body.priv .amt{filter:blur(7px);user-select:none;transition:filter .15s}
body.priv .amt:hover{filter:blur(3px)}
@media print{.amt{filter:none!important}}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:16px}
dialog::backdrop{background:#0008}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
h2{margin:0 0 10px;font-size:17px}.mu{color:var(--mu)}svg text{fill:var(--mu);font-size:11px}
</style></head><body>
<div id="saveErr" style="display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:var(--rd);color:#fff;padding:10px 14px;text-align:center;font-weight:600;align-items:center;justify-content:center;gap:10px">⚠ Not saving — your browser's storage is full. Nothing new is being kept. <button class="btn s" style="background:#fff;color:var(--rd)" onclick="go('set');dl('emergency-backup-'+today()+'.json',JSON.stringify(S))">Download backup now</button></div>
<div id="gate" class="gate"></div>
<div id="rcpt"></div>
<header><img id="lg" alt="" hidden><span class="brand" id="bn"></span>
<button id="pv" class="btn s g" style="margin-left:auto" onclick="togglePriv()">👁 Show amounts</button>
<button id="lo" class="btn s g" onclick="logout()">Logout</button>
<div class="search"><input id="q" placeholder="Search name, phone, account or receipt no…" autocomplete="off"><div id="sr"></div></div></header>
<nav id="nav"></nav><main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
let S={c:[],l:[],collectors:[],cfg:{name:'My Lending Co.',addr:'',phone:'',cur:'UGX',pen:5,logo:'',pin:''},n:1},tab='dash',sel=null,DL=null,role=null,curUser=null,collectQ='',rFrom=null,rTo=null,rCol='all',stmtFrom=null,stmtTo=null,selLoan=null,selInv=null,selSav=null;
const inRange=d=>(!stmtFrom||d>=stmtFrom)&&(!stmtTo||d<=stmtTo);
// Cloud D1 is authoritative; browser data is never loaded automatically.
S.collectors=S.collectors||[];S.investors=S.investors||[];S.expenses=S.expenses||[];S.savings=S.savings||[];S.tellers=S.tellers||[];S.supervisors=S.supervisors||[];assignAccounts();
let saveFailed=false;
let cloudRevision=0,cloudBusy=false,cloudPending=false,cloudLocked=false;
const save=()=>{cloudPending=true;if(!cloudBusy)void flushCloud()};
async function flushCloud(){
 if(cloudBusy||cloudLocked)return;cloudBusy=true;
 try{
  while(cloudPending){
   cloudPending=false;
   const res=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:cloudRevision,state:S})});
   if(res.status===409){cloudLocked=true;alert('Another device changed the database. Your unsaved changes are still visible here. Export a backup, then reload. No changes were overwritten.');break}
   if(!res.ok)throw Error((await res.json()).error||'Cloud save failed');
   cloudRevision=(await res.json()).revision;
  }
  if(!cloudLocked){saveFailed=false;$('#saveErr').style.display='none'}
 }catch(e){saveFailed=true;cloudLocked=true;$('#saveErr').style.display='flex';alert('Cloud save failed: '+e.message+'. Export your current data before reloading.')}
 finally{cloudBusy=false}
}
async function cloudStart(){
 const gate=$('#gate');document.body.classList.add('gated');gate.style.display='flex';
 gate.innerHTML='<div class="card"><h2>Cloud sign in</h2><p>Sign in to access the shared D1 database.</p><label>Cloud administrator password</label><input id="cloudPass" type="password" autocomplete="current-password"><div class="bar"><button class="btn" id="cloudLogin">Sign in</button></div><p class="hint" id="cloudMsg"></p></div>';
 const load=async()=>{
 const r=await fetch('/api/state');if(!r.ok)throw Error('Cannot load cloud data: '+r.status);
 const d=await r.json();cloudRevision=d.revision;
 if(!d.state){
  gate.innerHTML='<div class="card"><h2>Set up shared cloud records</h2><p>The cloud database is empty. Import your existing Loan Manager JSON backup, or start with a blank database.</p><label>Loan Manager backup (.json)</label><input id="cloudBackup" type="file" accept=".json,application/json"><div class="bar"><button class="btn" id="cloudImport">Import backup</button><button class="btn g" id="cloudBlank">Start empty</button></div><p class="hint" id="cloudImportMsg"></p></div>';
  const finish=()=>{S.collectors=S.collectors||[];S.investors=S.investors||[];S.expenses=S.expenses||[];S.savings=S.savings||[];S.tellers=S.tellers||[];S.supervisors=S.supervisors||[];assignAccounts();render();boot()};
  $('#cloudImport').onclick=async()=>{
   const file=$('#cloudBackup').files[0];if(!file)return $('#cloudImportMsg').textContent='Choose a JSON backup first.';
   if(file.size>3500000)return $('#cloudImportMsg').textContent='Backup exceeds the 3.5 MB import limit.';
   try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.c)||!Array.isArray(data.l)||!data.cfg||typeof data.cfg!=='object'||!Number.isSafeInteger(data.n))throw Error('Not a supported Loan Manager backup.');
    if(new Set(data.c.map(x=>x.id)).size!==data.c.length||new Set(data.l.map(x=>x.id)).size!==data.l.length)throw Error('Duplicate customer or loan IDs in backup.');
    if(!confirm('Import '+data.c.length+' customers and '+data.l.length+' loans into the EMPTY cloud database? This action cannot be undone from the app.'))return;
    $('#cloudImport').disabled=true;
    const response=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:0,state:data})});
    if(!response.ok)throw Error((await response.json()).error||'Import failed');
    cloudRevision=(await response.json()).revision;S=data;finish();
   }catch(e){$('#cloudImportMsg').textContent=e.message;$('#cloudImport').disabled=false}
  };
  $('#cloudBlank').onclick=()=>{if(confirm('Start with a blank cloud database? You can only import a backup automatically while the database is empty.'))finish()};
  return;
 }
 S=d.state;S.collectors=S.collectors||[];S.investors=S.investors||[];S.expenses=S.expenses||[];S.savings=S.savings||[];S.tellers=S.tellers||[];S.supervisors=S.supervisors||[];assignAccounts();render();boot();
}
 try{const r=await fetch('/api/session');if(r.ok){await load();return}}catch(e){}
 $('#cloudLogin').onclick=async()=>{const pass=$('#cloudPass').value;$('#cloudMsg').textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});if(!r.ok)throw Error('Invalid password or cloud configuration');await load()}catch(e){$('#cloudMsg').textContent=e.message}};
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>`<span class="amt">${S.cfg.cur} ${Math.round(n).toLocaleString()}</span>`;
const fmtN=n=>`${S.cfg.cur} ${Math.round(n).toLocaleString()}`;
let priv=true;
function applyPriv(){document.body.classList.toggle('priv',priv&&role!='collector'&&role!='teller'&&role!='supervisor');const b=$('#pv');if(b)b.textContent=priv?'👁 Show amounts':'🙈 Hide amounts'}
function togglePriv(){
 if(priv){if(S.cfg.pin){const p=prompt('Enter admin PIN to reveal amounts:');if(p===null)return;if(p!==S.cfg.pin){alert('Incorrect PIN');return}}priv=false}
 else priv=true;
 applyPriv()}
function boot(){if(!S.cfg.pin)showSetup();else showLogin()}
function showSetup(){document.body.classList.add('gated');const g=$('#gate');g.style.display='flex';
 g.innerHTML=`<div class="card">${S.cfg.logo?`<div style="text-align:center;margin-bottom:10px"><img src="${S.cfg.logo}" style="max-height:110px;max-width:100%"></div>`:''}<h2>Set up admin PIN</h2><p class="mu">Create a PIN to protect this app. You'll log in with the name Admin (changeable later in Settings) and this PIN, and use the PIN to reveal amounts.</p>
 <label>New PIN</label><input id="sp1" type="password" inputmode="numeric"><label>Confirm PIN</label><input id="sp2" type="password" inputmode="numeric">
 <div class="bar" style="margin-top:12px"><button class="btn" onclick="doSetup()">Save & continue</button></div><p class="hint" id="serr" style="color:var(--rd)"></p></div>`}
function doSetup(){const a=$('#sp1').value,b=$('#sp2').value;if(a.length<4)return $('#serr').textContent='PIN must be at least 4 digits';if(a!==b)return $('#serr').textContent='PINs do not match';S.cfg.pin=a;save();showLogin()}
function nameTaken(n,kind,id){n=String(n).trim().toLowerCase();
 if(kind!='admin'&&(S.cfg.adminName||'Admin').trim().toLowerCase()==n)return true;
 if(S.collectors.some(c=>c.name.trim().toLowerCase()==n&&!(kind=='c'&&c.id==id)))return true;
 if((S.tellers||[]).some(c=>c.name.trim().toLowerCase()==n&&!(kind=='t'&&c.id==id)))return true;if((S.supervisors||[]).some(c=>c.name.trim().toLowerCase()==n&&!(kind=='s'&&c.id==id)))return true;return false}
function showLogin(){document.body.classList.add('gated');const g=$('#gate');g.style.display='flex';
 g.innerHTML=`<div class="card">${S.cfg.logo?`<div style="text-align:center;margin-bottom:10px"><img src="${S.cfg.logo}" style="max-height:110px;max-width:100%"></div>`:''}<h2 style="text-align:center">${esc(S.cfg.name||'Loan Manager')}</h2>
 <label>Name</label><input id="lname" autocomplete="off" autocapitalize="none" onkeydown="if(event.key=='Enter')$('#lpin').focus()">
 <label>PIN</label><input id="lpin" type="password" inputmode="numeric" onkeydown="if(event.key=='Enter')doLogin()">
 <div class="bar" style="margin-top:12px"><button class="btn" onclick="doLogin()">Login</button></div><p class="hint" id="lerr" style="color:var(--rd)"></p></div>`;
 setTimeout(()=>{const x=$('#lname');if(x)x.focus()},50)}
function doLogin(){const n=$('#lname').value.trim().toLowerCase(),p=$('#lpin').value,hits=[];
 if(!n||!p)return $('#lerr').textContent='Enter your name and PIN';
 const an=(S.cfg.adminName||'Admin').trim();
 if(n==an.toLowerCase()&&p===S.cfg.pin)hits.push({r:'admin',u:{name:an}});
 S.collectors.forEach(c=>{if(c.name.trim().toLowerCase()==n&&c.pin===p)hits.push({r:'collector',u:c})});
 (S.tellers||[]).forEach(c=>{if(c.name.trim().toLowerCase()==n&&c.pin===p)hits.push({r:'teller',u:c})});
 (S.supervisors||[]).forEach(c=>{if(c.name.trim().toLowerCase()==n&&c.pin===p)hits.push({r:'supervisor',u:c})});
 if(!hits.length)return $('#lerr').textContent='Name or PIN is incorrect';
 if(hits.length>1)return $('#lerr').textContent='Two accounts share this name and PIN — ask the admin to give one a different name.';
 role=hits[0].r;curUser=hits[0].u;
 priv=true;document.body.classList.remove('gated');$('#gate').style.display='none';tab=role=='collector'?'collect':role=='teller'?'sav':'dash';sel=null;render()}
function logout(){role=null;curUser=null;showLogin()}
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,m)=>{const x=new Date(d);if(isNaN(x.getTime()))return null;x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const dd=(a,b)=>Math.floor((new Date(a)-new Date(b))/864e5);
const cust=id=>S.c.find(c=>c.id==id)||{name:'?',phone:''};
const topInto=l=>l.top?(Array.isArray(l.top.into)?l.top.into:[l.top.into]):[];
const WA_DEFAULT="Hello {name}, this is a reminder from {company}. Your loan balance of {balance} was due on {due}. Kindly make your payment at your earliest convenience. Thank you.";
function waPhone(ph){let d=(ph||'').replace(/\D/g,'');if(!d)return null;const cc=S.cfg.waCc||'256';if(d.startsWith('0'))d=cc+d.slice(1);else if(!d.startsWith(cc))d=cc+d;return d}
function waMsg(l){const c=cust(l.c);return(S.cfg.waTemplate||WA_DEFAULT)
 .replace(/{name}/g,c.name).replace(/{company}/g,S.cfg.name).replace(/{balance}/g,fmtN(l.bal)).replace(/{due}/g,l.due).replace(/{days}/g,l.od||0)}
function waHref(phone,msg){const d=waPhone(phone);return d?`https://wa.me/${d}?text=${encodeURIComponent(msg)}`:null}
function waOpen(phone,msg){const href=waHref(phone,msg);if(!href){alert('No phone number on file for this client.');return}
 location.href=href}
function waRemind(id){const l=L().find(x=>x.id==id);waOpen(l.ph,waMsg(l))}
function waRemindStmt(custId){const ls=L().filter(x=>x.c==custId&&(x.st=='Overdue'||x.st=='Active')).sort((a,b)=>b.od-a.od);
 if(!ls.length)return alert('No outstanding balance to remind this client about.');waRemind(ls[0].id)}
function findReceipt(rc,skipLoan,skipIdx){
 rc=(rc||'').trim().toLowerCase();if(!rc)return null;
 for(const l of S.l)for(let i=0;i<l.pay.length;i++){
  if(l.id==skipLoan&&i==skipIdx)continue;
  if((l.pay[i].rc||'').trim().toLowerCase()==rc)return{loan:l,p:l.pay[i],label:'loan #'+l.id};
 }
 for(const t of (S.savings||[])){if((t.rc||'').trim().toLowerCase()==rc)return{loan:{id:0,c:t.c},p:t,label:'a savings '+t.type}}
 return null;
}
function calc(l){
 const due=addM(l.d,l.t),hasDate=!!due;
 const interest=l.p*l.r/100*l.t,base=l.p+interest,paid=l.pay.reduce((s,x)=>s+x.a,0);
 if(l.top)return{interest,due:due||'—',base,paid,od:0,pen:0,bal:0,st:'Topped up',last:l.pay.length?l.pay.map(x=>x.dt).sort().pop():null,hasDate,lateSettled:false};
 const unpaid=Math.max(0,base-paid);
 const od=(l.wo||!hasDate||unpaid<=0)?0:Math.max(0,dd(today(),due));
 const pen=od>0?unpaid*l.pr/100*od/30:0,bal=Math.max(0,base+pen-paid);
 const last=l.pay.length?l.pay.map(x=>x.dt).sort().pop():null;
 const st=l.wo?'Written off':!hasDate?'Fix date':bal<1?'Paid':od>0?'Overdue':'Active';
 return{interest,due:due||'—',base,paid,od,pen,bal,st,last,hasDate,lateSettled:st=='Paid'&&last>due};
}
const L=()=>S.l.map(l=>({...l,...calc(l),cn:cust(l.c).name,ph:cust(l.c).phone}));
function icalc(inv){
 const paid=inv.pay.reduce((s,x)=>s+x.a,0),totalCommit=inv.monthly*inv.term,due=addM(inv.start,inv.term);
 if(inv.type=='bundled'){const liability=Math.max(0,totalCommit-paid);return{paid,totalCommit,remainMonthly:liability,principalOwed:0,liability,due:due||'—',bundled:true}}
 const remainMonthly=Math.max(0,totalCommit-paid),principalOwed=inv.principalRepaid?0:inv.principal;
 return{paid,totalCommit,remainMonthly,principalOwed,liability:remainMonthly+principalOwed,due:due||'—',bundled:false};
}
const IL=()=>(S.investors||[]).map(i=>({...i,...icalc(i)}));
function capV(){
 const inv=IL(),totalLiab=inv.reduce((s,i)=>s+i.liability,0);
 return `<p class="mu">Money you've borrowed to fund lending — this is a liability, kept separate from what borrowers owe you.</p>
 <div class="bar"><button class="btn" onclick="invForm()">+ New capital source</button><button class="btn g" onclick="window.print()">Print</button><button class="btn g" onclick="csvDl('investors',[['Name','Principal','Monthly','Term','Start','Paid','Remaining monthly','Principal owed','Total liability'],...IL().map(i=>[i.name,i.principal,i.monthly,i.term,i.start,Math.round(i.paid),Math.round(i.remainMonthly),Math.round(i.principalOwed),Math.round(i.liability)])])">Excel (CSV)</button></div>
 <div class="card"><h2>Total owed to investors</h2><b style="font-size:20px">${fmt(totalLiab)}</b></div>
 <div class="card">${table(['Name','Structure','Principal','Monthly × Term','Paid','Remaining','Liability now',''],inv.map(i=>[esc(i.name),i.bundled?'Bundled (monthly repays all)':'Separate (principal at end)',fmt(i.principal),`${fmt(i.monthly)} × ${i.term}`,fmt(i.paid),fmt(i.remainMonthly)+(i.bundled?'':i.principalRepaid?' + principal repaid':' + '+fmtN(i.principalOwed)+' principal'),`<b>${fmt(i.liability)}</b>`,
 `${i.remainMonthly>0?`<button class="btn s" onclick="invPayForm(${i.id})">Record payment</button> `:''}${(!i.bundled&&!i.principalRepaid)?`<button class="btn s g" onclick="invRepay(${i.id})">Repay principal</button> `:''}${i.pay.length?`<button class="btn s g" onclick="invPayList(${i.id})">View payments</button> `:''}<button class="btn s g" onclick="go('cstmt',${i.id})">Statement</button> <button class="btn s g" onclick="invForm(${i.id})">Edit</button> <button class="btn s d" onclick="invDel(${i.id})">Delete</button>`]),'No capital sources yet.')}</div>`;
}
function invForm(id){const i=S.investors.find(x=>x.id==id)||{};const ty=i.type||'separate';
 open(`<h2>${id?'Edit':'New'} capital source</h2><label>Investor / lender name</label><input id="f1" value="${esc(i.name)}"><label>Principal received (${esc(S.cfg.cur)})</label><input id="f2" type="number" min="0" value="${i.principal||''}">
 <label>Agreed monthly payment</label><input id="f3" type="number" min="0" value="${i.monthly||''}"><label>Term (months)</label><input id="f4" type="number" min="1" value="${i.term||12}"><label>Start date</label><input id="f5" type="date" value="${i.start||today()}">
 <label>How does repayment work?</label><select id="f6">
 <option value="separate" ${ty=='separate'?'selected':''}>Separate — monthly payment is a fee; I return the full principal at the end</option>
 <option value="bundled" ${ty=='bundled'?'selected':''}>Bundled — the monthly payments themselves fully repay it (principal included); nothing extra at the end</option></select>

function schedule(o){

  return{interest,base,installment:base/rows.length,rows,manual:true};
 }
 const base=o.p+interest,installment=base/o.t,rows=[];
 for(let n=1;n<=o.t;n++)rows.push({n,due:addM(o.d,n),amt:installment});
 return{interest,base,installment,rows,manual:false};
}

function autoBackupV(){
 if(!window.showDirectoryPicker)return `<div class="card"><h2>Automatic backups</h2><p class="mu">Automatic folder backups need Chrome or Edge on a computer. In this browser, please keep using the manual "Download backup" button above regularly.</p></div>`;
 const g=S.cfg,has=!!dirHandle,needsReconnect=has&&dirPerm&&dirPerm!='granted';
 return `<div class="card"><h2>Automatic backups</h2><p class="mu">Pick a folder once — after that, backups save there by themselves. Browsers require re-confirming folder access each time you reopen the app, which happens automatically in the background — but if it ever can't, it'll show here with a one-click fix rather than failing silently.</p>
 <div class="bar"><button class="btn" onclick="pickDir()">${has?'Change folder':'Choose backup folder'}</button>${has?`<button class="btn g" onclick="backupNow()">Backup now</button>`:''}</div>
 ${needsReconnect?`<div class="card" style="background:#b7791f14;border-color:var(--am);margin:10px 0"><b style="color:var(--am)">⚠ Backup folder access needs reconnecting for this session.</b><p class="mu" style="margin:4px 0 8px">This is a normal browser security step, not an error — it happens after the browser restarts. Automatic backups have been paused until you reconnect.</p><button class="btn s" onclick="reconnectDir()">Reconnect folder access</button></div>`:''}
 ${(g.lastAutoBackupError&&!needsReconnect)?`<p class="hint" style="color:var(--rd)">⚠ Last automatic backup attempt failed (${new Date(g.lastAutoBackupError.at).toLocaleString()}): ${esc(g.lastAutoBackupError.msg)}</p>`:''}
 ${has?`<p class="mu">Folder: <b>${esc(dirName||'(selected)')}</b> · Last successful automatic backup: ${g.lastAutoBackup?new Date(g.lastAutoBackup).toLocaleString():'never yet'}</p>
 <div class="two"><div><label><input type="checkbox" id="abOn" ${g.autoBackup?'checked':''} style="width:auto;margin-right:6px">Back up automatically every day</label>
 <label>At time</label><input id="abTime" type="time" value="${g.backupTime||'23:00'}">
 <label><input type="checkbox" id="abClose" ${g.backupOnClose!==false?'checked':''} style="width:auto;margin-right:6px">Also back up when I close or leave the app</label></div>
 <div><label>Keep the last</label><input id="abKeep" type="number" min="1" max="365" value="${g.backupKeep||14}"><label style="margin-top:-4px">backups (older ones are deleted automatically)</label></div></div>
 <div class="bar" style="margin-top:12px"><button class="btn" onclick="saveBackupCfg()">Save backup settings</button></div>`:''}</div>`;
}

// ---- automatic folder backups (Chrome/Edge desktop only, File System Access API)
let dirHandle=null,dirName=null,dirPerm=null;
function idbOp(mode,fn){return new Promise((res,rej)=>{const rq=indexedDB.open('loanapp-fs',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
 rq.onsuccess=()=>{const tx=rq.result.transaction('kv',mode);fn(tx.objectStore('kv'),res,rej)};rq.onerror=()=>rej(rq.error)})}
const idbGet=k=>idbOp('readonly',(s,res,rej)=>{const g=s.get(k);g.onsuccess=()=>res(g.result);g.onerror=()=>rej(g.error)});
const idbSet=(k,v)=>idbOp('readwrite',(s,res,rej)=>{const p=s.put(v,k);p.onsuccess=()=>res();p.onerror=()=>rej(p.error)});
async function loadDirHandle(){if(!window.showDirectoryPicker)return;try{const h=await idbGet('backupDir');if(h){dirHandle=h;dirName=h.name;
 try{dirPerm=await h.queryPermission({mode:'readwrite'})}catch(e){dirPerm='error'}
 if(tab=='set')render()}}catch(e){}}
async function pickDir(){try{const h=await window.showDirectoryPicker({id:'loanbackup',mode:'readwrite'});
 const p=await h.requestPermission({mode:'readwrite'});if(p!=='granted'){alert('Permission was not granted.');return}
 dirHandle=h;dirName=h.name;dirPerm='granted';await idbSet('backupDir',h);if(!S.cfg.backupTime){S.cfg.autoBackup=true;S.cfg.backupTime='23:00';S.cfg.backupOnClose=true;S.cfg.backupKeep=S.cfg.backupKeep||14;save()}
 await backupNow(true);render();alert('Backup folder set. Backups will now save here automatically.')}catch(e){if(e.name!='AbortError')alert('Could not use that folder: '+e.message)}}
async function reconnectDir(){if(!dirHandle)return;try{dirPerm=await dirHandle.requestPermission({mode:'readwrite'});
 if(dirPerm!='granted'){alert('Permission was not granted.');render();return}
 await backupNow(false)}catch(e){alert('Could not reconnect: '+(e.message||e));render()}}
async function backupNow(silent){
 if(!dirHandle)return;
 try{
  let perm=await dirHandle.queryPermission({mode:'readwrite'});dirPerm=perm;
  if(perm!='granted'){
   if(silent){S.cfg.lastAutoBackupError={msg:'Folder access needs reconnecting — open Settings and click "Reconnect".',at:new Date().toISOString()};save();return}
   perm=await dirHandle.requestPermission({mode:'readwrite'});dirPerm=perm;
   if(perm!='granted'){S.cfg.lastAutoBackupError={msg:'Permission was not granted.',at:new Date().toISOString()};save();return}
  }
  const fh=await dirHandle.getFileHandle(`backup-${today()}.json`,{create:true}),w=await fh.createWritable();
  await w.write(JSON.stringify(S));await w.close();
  S.cfg.lastAutoBackup=new Date().toISOString();S.cfg.lastAutoBackupError=null;save();
  await pruneBackups();if(!silent){render();alert('Backup saved.')}
 }catch(e){S.cfg.lastAutoBackupError={msg:e.message||String(e),at:new Date().toISOString()};save();if(!silent){render();alert('Backup failed: '+(e.message||e))}}
}
async function pruneBackups(){
 if(!dirHandle)return;try{
  const keep=S.cfg.backupKeep||14,files=[];
  for await(const [name] of dirHandle.entries())if(/^backup-\d{4}-\d{2}-\d{2}\.json$/.test(name))files.push(name);
  files.sort();while(files.length>keep){const old=files.shift();try{await dirHandle.removeEntry(old)}catch(e){}}
 }catch(e){}
}
setInterval(()=>{if(!dirHandle||!S.cfg.autoBackup)return;const t=new Date(),hm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
 if(hm==(S.cfg.backupTime||'23:00')&&(S.cfg.lastAutoBackup||'').slice(0,10)!=today())backupNow(true)},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirHandle&&S.cfg.backupOnClose!==false)backupNow(true)});
window.addEventListener('pagehide',()=>{if(dirHandle&&S.cfg.backupOnClose!==false)backupNow(true)});
function restore(){const f=$('#rf').files[0];if(!f)return alert('Choose a backup file');const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.c||!d.l||!d.cfg)throw 0;if(!confirm('Replace all current data with this backup?'))return;
 d.collectors=d.collectors||[];d.investors=d.investors||[];d.expenses=d.expenses||[];d.savings=d.savings||[];d.tellers=d.tellers||[];d.supervisors=d.supervisors||[];S=d;assignAccounts();save();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function storageInfo(){const bytes=new Blob([JSON.stringify(S)]).size,kb=(bytes/1024).toFixed(0),pct=Math.min(100,Math.round(bytes/(5*1024*1024)*100));
 return `<p class="mu">Data size: ${kb} KB (browsers typically allow about 5–10 MB total). ${pct>=70?`<b style="color:${pct>=90?'var(--rd)':'var(--am)'}">${pct}% of a typical 5 MB limit — ${pct>=90?'back up now and consider removing some customer photos.':'keep an eye on this, especially if you add more photos.'}</b>`:`Comfortably within limits (${pct}%).`}</p>`;
}

 }
